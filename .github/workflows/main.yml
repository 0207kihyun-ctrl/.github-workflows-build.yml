name: APK
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: 17, distribution: temurin}
    - name: Install Android SDK 35
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
          exit 1
        fi
        echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
        yes | "$SDKMANAGER" --licenses || true
        "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
    - run: |
        unzip -o ShortsRemote_Source_Compatibility.zip
        cp -rf ShortsRemote/* .
        sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts
        wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
        unzip -q gradle-8.9-bin.zip
        cat > gradle.properties <<'EOF'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        org.gradle.workers.max=2
        org.gradle.parallel=false
        EOF
        ./gradle-8.9/bin/gradle --no-daemon --max-workers=2 assembleDebug
    - uses: actions/upload-artifact@v4
      with: {name: apk, path: "**/*.apk"}
