name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Prepare project without changing repository source
        run: |
          unzip -o ShortsRemote_Source_Compatibility.zip
          cp -rf ShortsRemote/* .
          echo '===== BluetoothHidManager.kt (source inspection) ====='
          sed -n '1,320p' app/src/main/java/com/shortsremote/app/bluetooth/BluetoothHidManager.kt
          echo '===== AndroidManifest Bluetooth permissions ====='
          grep -n -E 'BLUETOOTH|uses-feature|application|uses-sdk' app/src/main/AndroidManifest.xml || true
          # Replace the old touchpad with a dedicated vertical mouse-wheel screen.
          rm -f app/src/main/java/com/shortsremote/app/ui/TouchpadScreen.kt
          cat > app/src/main/java/com/shortsremote/app/ui/WheelScreen.kt <<'KOTLIN'
          package com.shortsremote.app.ui

          import android.view.HapticFeedbackConstants
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.wear.compose.material.*
          import com.shortsremote.app.bluetooth.BluetoothHidManager
          import com.shortsremote.app.ui.theme.*

          @Composable
          fun WheelScreen(
              hidManager: BluetoothHidManager,
              onNavigateBack: () -> Unit
          ) {
              val view = LocalView.current
              var directionText by remember { mutableStateOf("드래그해서 커서 이동") }
              var wheelMode by remember { mutableStateOf(false) }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(PureBlack)
                      .pointerInput(wheelMode) {
                          var wheelRemainder = 0f
                          detectDragGestures { change, dragAmount ->
                              change.consume()
                              if (wheelMode) {
                                  // Keep wheel input small and steady.
                                  wheelRemainder += -dragAmount.y * 0.35f
                                  val steps = wheelRemainder.toInt()
                                  if (steps != 0) {
                                      hidManager.sendMouseWheel(steps)
                                      wheelRemainder -= steps
                                      directionText = if (steps > 0) "위로 스크롤" else "아래로 스크롤"
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  }
                              } else {
                                  // Relative mouse movement lets the user move the iPhone pointer away from the edge.
                                  val dx = (dragAmount.x * 1.6f).toInt()
                                  val dy = (dragAmount.y * 1.6f).toInt()
                                  if (dx != 0 || dy != 0) {
                                      hidManager.sendMouseMove(dx, dy)
                                      directionText = "커서 이동 중"
                                  }
                              }
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      modifier = Modifier.fillMaxSize().padding(horizontal = 18.dp, vertical = 22.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Text(if (wheelMode) "마우스 휠" else "마우스 터치패드", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = TextWhite)
                      Spacer(Modifier.height(12.dp))
                      Text(directionText, fontSize = 11.sp, color = AccentBlue)
                      Spacer(Modifier.height(8.dp))
                      Text(if (wheelMode) "위아래로 쓸어 쇼츠 넘기기 (마우스 휠)" else "손가락을 움직여 커서 이동", fontSize = 9.sp, color = TextMuted)
                      Spacer(Modifier.height(10.dp))
                      Text(
                          text = if (wheelMode) "커서 이동 모드로 전환" else "쇼츠 스크롤 모드로 전환",
                          fontSize = 10.sp,
                          color = AccentBlue,
                          modifier = Modifier.clickable { wheelMode = !wheelMode }
                      )
                      Spacer(Modifier.height(18.dp))
                      Button(
                          onClick = onNavigateBack,
                          colors = ButtonDefaults.buttonColors(
                              backgroundColor = DarkSurfaceElevated,
                              contentColor = TextWhite
                          )
                      ) {
                          Text("뒤로", fontSize = 11.sp)
                      }
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/shortsremote/app/MainActivity.kt")
          s = main.read_text()
          s = s.replace("import com.shortsremote.app.ui.TouchpadScreen", "import com.shortsremote.app.ui.WheelScreen")
          s = s.replace("    TOUCHPAD,", "    WHEEL,")
          s = s.replace("onNavigateToTouchpad = { currentScreen = ScreenState.TOUCHPAD }", "onNavigateToWheel = { currentScreen = ScreenState.WHEEL }")
          s = s.replace("ScreenState.TOUCHPAD -> {", "ScreenState.WHEEL -> {")
          s = s.replace("TouchpadScreen(", "WheelScreen(")
          s = s.replace("WheelScreen(\n                                hidManager = hidManager,\n                                wristMotionDetector = wristMotionDetector,\n", "WheelScreen(\n                                hidManager = hidManager,\n")
          main.write_text(s)

          ui = Path("app/src/main/java/com/shortsremote/app/ui/MainShortsScreen.kt")
          s = ui.read_text()
          s = s.replace("onNavigateToTouchpad", "onNavigateToWheel")
          s = s.replace("터치패드 이동 →", "마우스 휠 →")
          s = s.replace("터치패드로 이동", "마우스 휠 모드")
          s = s.replace("Header: Connection status & Quick Nav to Touchpad", "Header: Connection status & Quick Nav to Mouse Wheel")
          ui.write_text(s)

          manager = Path("app/src/main/java/com/shortsremote/app/bluetooth/BluetoothHidManager.kt")
          s = manager.read_text().replace("Galaxy Watch 5 Shorts Remote & Touchpad", "Galaxy Watch 5 Shorts Remote & Mouse Wheel")
          manager.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path

          payload_file = Path("app/src/main/java/com/shortsremote/app/bluetooth/HidPayloads.kt")
          payload = payload_file.read_text(encoding="utf-8")
          if "MOUSE_BUTTON_MIDDLE" not in payload:
              anchor = "    const val MOUSE_BUTTON_RIGHT: Byte = 0x02"
              if anchor not in payload:
                  raise SystemExit("Mouse button constants not found")
              payload = payload.replace(anchor, anchor + "\n    const val MOUSE_BUTTON_MIDDLE: Byte = 0x04", 1)
          payload_file.write_text(payload, encoding="utf-8")

          manager_file = Path("app/src/main/java/com/shortsremote/app/bluetooth/BluetoothHidManager.kt")
          manager = manager_file.read_text(encoding="utf-8")
          if "fun sendMouseButton(button: Byte, actionName: String)" not in manager:
              anchor = "    fun sendNextShort() {"
              helper = """    @SuppressLint("MissingPermission")
              fun sendMouseButton(button: Byte, actionName: String) {
                  val proxy = hidDevice
                  val target = connectedDevice
                  if (proxy == null || target == null) {
                      _lastLog.value = "iPhone HID 미연결 - 버튼 전송 대기"
                      return
                  }

                  scope.launch {
                      try {
                          val down = HidPayloads.mouseReport(
                              buttons = button, dx = 0, dy = 0, wheel = 0
                          )
                          val downSent = proxy.sendReport(
                              target, HidReportDescriptor.REPORT_ID_MOUSE.toInt(), down
                          )
                          delay(45)
                          val up = HidPayloads.mouseReport(
                              buttons = HidPayloads.MOUSE_BUTTON_NONE,
                              dx = 0, dy = 0, wheel = 0
                          )
                          val upSent = proxy.sendReport(
                              target, HidReportDescriptor.REPORT_ID_MOUSE.toInt(), up
                          )
                          _lastLog.value = if (downSent && upSent) {
                              "$actionName 마우스 버튼 전송 완료"
                          } else {
                              "$actionName 마우스 버튼 전송 실패"
                          }
                      } catch (e: Exception) {
                          Log.e(TAG, "$actionName mouse button failed", e)
                          _lastLog.value = "$actionName 전송 오류"
                      }
                  }
              }

          """
              if anchor not in manager:
                  raise SystemExit("Shorts action methods not found")
              manager = manager.replace(anchor, helper + anchor, 1)

          replacements = {
              "sendKeyPress(HidPayloads.KEY_DOWN_ARROW)\n        _lastLog.value = \"다음 쇼츠 전송 (KEY_DOWN_ARROW 0x51)\"":
                  "sendMouseWheel(-1)\n        _lastLog.value = \"다음 쇼츠: 마우스 휠 아래\"",
              "sendKeyPress(HidPayloads.KEY_UP_ARROW)\n        _lastLog.value = \"이전 쇼츠 전송 (KEY_UP_ARROW 0x52)\"":
                  "sendMouseWheel(1)\n        _lastLog.value = \"이전 쇼츠: 마우스 휠 위\"",
              "sendKeyPress(HidPayloads.KEY_L)\n        _lastLog.value = \"좋아요 전송 (KEY_L 0x0F)\"":
                  "sendMouseButton(HidPayloads.MOUSE_BUTTON_LEFT, \"좋아요\")\n        _lastLog.value = \"좋아요: 표준 마우스 왼쪽 클릭\""
          }
          for old, new in replacements.items():
              if old not in manager:
                  raise SystemExit("Could not find expected Shorts key mapping: " + old.split("\\n")[0])
              manager = manager.replace(old, new, 1)

          manager_file.write_text(manager, encoding="utf-8")
          print("HID button mapping applied: Next=Left, Like=Middle, Previous=Right")
          print("Mouse wheel report and descriptor left unchanged.")
          PY
          TARGET="app/src/main/java/com/shortsremote/app/ui/TouchpadScreen.kt"
          if [ -f "$TARGET" ] && ! grep -q '^import androidx.compose.foundation.clickable$' "$TARGET"; then
            sed -i '/^package /a import androidx.compose.foundation.clickable' "$TARGET"
          fi
          sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts
          mkdir -p app/src/main/res/values app/src/main/res/drawable
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.ShortsRemote" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#6750A4" android:pathData="M12,12h84v84h-84z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M42,30 L42,78 L78,54 Z"/>
          </vector>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
          ./gradle-8.9/bin/gradle --no-daemon --max-workers=2 assembleDebug
          mkdir -p artifacts
          find . -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk
          if-no-files-found: error
