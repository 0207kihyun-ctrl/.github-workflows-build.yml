name: APK
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: 17, distribution: temurin}
    - uses: android-actions/setup-android@v3
    - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
    - run: |
        unzip -o ShortsRemote_Source_Compatibility.zip
        cp -rf ShortsRemote/* .
        sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts
        wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
        unzip -q gradle-8.9-bin.zip
        echo "android.useAndroidX=true" > gradle.properties
        ./gradle-8.9/bin/gradle assembleDebug
    - uses: actions/upload-artifact@v4
      with: {name: apk, path: "**/*.apk"}
