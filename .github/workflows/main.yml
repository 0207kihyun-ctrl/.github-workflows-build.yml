name: APK
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {java-version: 17, distribution: temurin}
    - name: Install Android SDK 35
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
          exit 1
        fi
        echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
        yes | "$SDKMANAGER" --licenses || true
        "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
    - run: |
        unzip -o ShortsRemote_Source_Compatibility.zip
        cp -rf ShortsRemote/* .
        echo '===== HID PAYLOAD SOURCE ====='
        cat app/src/main/java/com/shortsremote/app/bluetooth/HidPayloads.kt
        echo '===== HID MANAGER KEY CALLS ====='
        grep -nE 'key|Key|report|send|press|release' app/src/main/java/com/shortsremote/app/bluetooth/BluetoothHidManager.kt || true
        sed -i '/^package /a import androidx.compose.foundation.clickable' app/src/main/java/com/shortsremote/app/ui/TouchpadScreen.kt
        sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts
        mkdir -p app/src/main/res/values app/src/main/res/drawable
        cat > app/src/main/res/values/themes.xml <<'EOF'
        <resources>
            <style name="Theme.ShortsRemote" parent="android:style/Theme.Material.Light.NoActionBar">
                <item name="android:fontFamily">sans</item>
                <item name="android:colorAccent">#6750A4</item>
                <item name="android:windowLightStatusBar">true</item>
            </style>
        </resources>
        EOF
        cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#6750A4" android:pathData="M12,12h84v84h-84z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M42,30 L42,78 L78,54 Z"/>
        </vector>
        EOF
        wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
        unzip -q gradle-8.9-bin.zip
        cat > gradle.properties <<'EOF'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        org.gradle.workers.max=2
        org.gradle.parallel=false
        EOF
        ./gradle-8.9/bin/gradle --no-daemon --max-workers=2 assembleDebug
        mkdir -p artifacts
        find . -type f -name '*.apk' -print -exec cp {} artifacts/ \;
        test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
    - uses: actions/upload-artifact@v4
      with: {name: apk, path: "artifacts/*.apk", if-no-files-found: error}
