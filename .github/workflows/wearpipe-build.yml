name: Build WearPipe APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WearPipe source
        uses: actions/checkout@v4
        with:
          repository: andyching168/WearPipe
          ref: dev
          path: WearPipe

      - name: Exclude YouTube Shorts from search results
        working-directory: WearPipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/wearMain/kotlin/net/wearpipe/app/data/NewPipeStreamingRepository.kt")
          source = path.read_text()
          old = "items = result.first.filterIsInstance<StreamInfoItem>().map { item ->"
          new = """items = result.first.filterIsInstance<StreamInfoItem>()
                          .filterNot { it.isShortFormContent }
                          .map { item ->"""
          if old not in source:
              raise SystemExit("Could not locate WearPipe search mapping; refusing to build without Shorts filter")
          path.write_text(source.replace(old, new, 1))
          print("YouTube Shorts search filtering applied.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Wear OS APK
        working-directory: WearPipe
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WearPipe-Watch5-debug
          path: WearPipe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
