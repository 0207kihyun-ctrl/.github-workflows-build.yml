name: Inspect ShortsRemote HID source
on:
  push:
    paths:
      - ".github/workflows/inspect-hid-source.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print HID source files
        run: |
          unzip -o ShortsRemote_Source_Compatibility.zip
          cp -rf ShortsRemote/* .
          echo "===== MAIN SHORTS SCREEN ====="
          sed -n '1,420p' app/src/main/java/com/shortsremote/app/ui/MainShortsScreen.kt
          echo "===== MAIN ACTIVITY ====="
          sed -n '1,300p' app/src/main/java/com/shortsremote/app/MainActivity.kt
